name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes do núcleo
        run: ./gradlew :core:test
      - name: Gerar APK de teste
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eletric-guardian-debug
          path: app/build/outputs/apk/debug/*.apk
      # Link fixo para baixar o .apk direto, sem zip:
      # https://github.com/<dono>/<repo>/releases/download/teste/eletric-guardian.apk
      - name: Publicar APK na versão de teste
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk eletric-guardian.apk
          notes="Gerado automaticamente a partir de $REF_NAME (commit ${GITHUB_SHA::7}) em $(date -u '+%d/%m/%Y %H:%M') UTC."
          if gh release view teste >/dev/null 2>&1; then
            gh release edit teste --notes "$notes"
          else
            gh release create teste --prerelease --title "Versão de teste" --notes "$notes"
          fi
          gh release upload teste eletric-guardian.apk --clobber
