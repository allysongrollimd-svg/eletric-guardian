<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      :root { color-scheme: light dark; --pictogram: #266800; }
      @media (prefers-color-scheme: dark) { :root { --pictogram: #8BDC5C; } }
      .s { fill: none; stroke: var(--pictogram); stroke-width: 7; stroke-linejoin: round; }
      .b { fill: var(--pictogram); stroke: var(--pictogram); stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Electric Guardian pictogram only (colors via CSS variables) -->
  <path class="s" d="M50 7 L83 18.5 V47 C83 69 68.5 84.5 50 93 C31.5 84.5 17 69 17 47 V18.5 Z"/>
  <path class="b" d="M55 25 L34 54 H47.5 L43.5 76 L66 44 H52 Z"/>
</svg>
