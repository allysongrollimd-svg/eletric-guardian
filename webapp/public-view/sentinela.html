<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="robots" content="noindex">
<title>Sentinela · Electric Guardian</title>
<link rel="stylesheet" href="/_eg/tokens.css">
<link rel="stylesheet" href="/_eg/rec.css">
</head>
<body>
<header class="top">
  <a class="ibtn" href="{{APP_URL}}/" aria-label="Voltar ao painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1>Sentinela</h1>
  <a class="ibtn" href="/surveillance.html" aria-label="Ajustes da sentinela" title="Ajustes da sentinela"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</header>
<div class="days">
  <button id="prev" aria-label="Dia anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="cur"><b id="dayMain">—</b><small id="daySub"></small></div>
  <button id="next" aria-label="Dia seguinte"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="filters" id="filters">
  <button class="on" data-f="all">Tudo</button><button data-f="person">Pessoas</button><button data-f="vehicle">Veículos</button><button data-f="bike">Bicicletas</button><button data-f="animal">Animais</button>
</div>
<main id="list" class="list"><div class="state"><b>Carregando…</b></div></main>
<button id="more" class="more" hidden>Carregar mais</button>
<section id="player" class="player" hidden aria-label="Reprodução">
  <header><button id="pClose" class="ibtn" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div><b id="pTitle"></b><small id="pSub"></small></div></header>
  <div class="vbox" id="vbox"><video id="video" playsinline preload="auto"></video><div class="vload" id="vload" role="status" aria-live="polite"><i class="spin"></i><b id="vloadTxt">Carregando…</b><span id="vloadSub"></span><div class="vbar"><i id="vloadBar"></i></div></div></div>
  <div class="buf" aria-hidden="true"><i id="bufBar"></i></div>
  <div class="ctl"><button id="pp" class="ibtn" aria-label="Reproduzir ou pausar"><svg id="ppIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição"><span id="time">0:00</span></div>
  <div class="quads" id="quads"><button data-q="all" class="on">Todas</button><button data-q="front">Frente</button><button data-q="right">Direita</button><button data-q="left">Esquerda</button><button data-q="rear">Traseira</button></div>
</section>
<script src="/_eg/rec.js" type="module" data-type="sentry"></script>
</body>
</html>
